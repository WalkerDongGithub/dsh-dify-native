# Test profile: run the harness itself on z.ai (the only reachable provider on
# this box), and disable the deepseek route that has no key for this profile.
- id: llm-pi-ai
  config:
    providers:
      zai:
        apiKeyEnv: ZAI_API_KEY
        models:
          - id: glm-4.5-air
            name: GLM-4.5-Air
            contextWindow: 131072
            maxTokens: 8192
- id: agent-default-model
  config:
    provider: zai
    model: glm-4.5-air
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
